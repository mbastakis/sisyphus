[project]
name = "sisyphus-taskboard"
version = "0.1.0"
description = "Private Taskwarrior Kanban UI"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9.0,<10",
  "ruff>=0.15,<0.16",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
