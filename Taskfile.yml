version: "3"

tasks:
  dev:backend:
    desc: Run the backend with fake in-memory data (never touches real Taskwarrior)
    dir: backend
    env:
      SISYPHUS_REPOSITORY: fake
      SISYPHUS_AUTH: none
      SISYPHUS_CONFIG: "{{.TASKFILE_DIR}}/config/boards.yaml"
    cmds:
      - uv run uvicorn sisyphus.main:app --host 127.0.0.1 --port 8422 --reload

  dev:frontend:
    desc: Run the frontend dev server (proxies /api to :8422)
    cmds:
      - npm --prefix frontend run dev

  test:backend:
    desc: Run backend unit and API tests
    dir: backend
    cmds:
      - uv run python -m pytest

  lint:
    desc: Lint the backend
    dir: backend
    cmds:
      - uv run --with ruff ruff check src tests

  test:taskwarrior:
    desc: Check native planning primitives in a disposable pinned-image replica
    vars:
      IMAGE: '{{default "sisyphus:latest" .IMAGE}}'
    cmds:
      - docker run --rm -i --entrypoint python '{{.IMAGE}}' - < scripts/check-taskwarrior-contract.py

  test:cli:
    desc: Check current services against a disposable pinned Taskwarrior replica
    vars:
      IMAGE: '{{default "sisyphus:latest" .IMAGE}}'
    cmds:
      - docker run --rm -i --entrypoint python -v '{{.TASKFILE_DIR}}/backend/src:/check/src:ro' -v '{{.TASKFILE_DIR}}/config:/check/config:ro' -e PYTHONPATH=/check/src '{{.IMAGE}}' - < scripts/check-cli-planning.py

  typecheck:
    desc: Typecheck the frontend
    cmds:
      - npm --prefix frontend run build

  icons:generate:
    desc: Generate app icons from the committed theme package
    cmds:
      - npm --prefix frontend run icons:generate

  icons:check:
    desc: Verify app icons match the committed theme package
    cmds:
      - npm --prefix frontend run icons:check

  config:validate:
    desc: Validate config/boards.yaml
    dir: backend
    cmds:
      - uv run python -m sisyphus.config.check "{{.TASKFILE_DIR}}/config/boards.yaml"

  build:frontend:
    desc: Build the production frontend bundle (frontend/dist)
    cmds:
      - npm --prefix frontend run build

  build:image:
    desc: Build the production container image
    cmds:
      - docker build -t sisyphus .

  e2e:sync:
    desc: Install browser-test dependencies and Chromium
    cmds:
      - npm --prefix tests/browser ci
      - npm --prefix tests/browser exec -- playwright install chromium

  test:e2e:
    desc: Run end-to-end browser tests against a production-style server (fake data)
    deps:
      - build:frontend
    cmds:
      - npm --prefix tests/browser test

  test:
    desc: Run all tests
    cmds:
      - task: test:backend
      - task: test:e2e

  validate:
    desc: Lint, typecheck, validate config, and run all tests
    cmds:
      - task: icons:check
      - task: lint
      - task: typecheck
      - task: config:validate
      - task: test
