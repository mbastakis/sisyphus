name: Publish release image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check semantic release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Stable SemVer only. GHCR tags cannot represent SemVer build metadata.
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "Expected a stable semantic release tag such as v0.1.0" >&2
            exit 1
          }

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Resolve the checked-out tag commit
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          revision=$(git rev-parse 'HEAD^{commit}')
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        id: image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/mbastakis/sisyphus:${{ steps.release.outputs.version }}
            ghcr.io/mbastakis/sisyphus:sha-${{ steps.release.outputs.revision }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}
            org.opencontainers.image.source=https://github.com/mbastakis/sisyphus
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          provenance: mode=min

      - name: Record artifact identity
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ steps.release.outputs.revision }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          {
            echo "## Published Sisyphus image"
            echo "- Version: $VERSION"
            echo "- Source commit: $REVISION"
            echo "- Platform: linux/amd64"
            echo "- Immutable image: ghcr.io/mbastakis/sisyphus@$DIGEST"
            echo "- Check anonymous access after initial package visibility setup."
          } >> "$GITHUB_STEP_SUMMARY"
