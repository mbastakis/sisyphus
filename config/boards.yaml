version: 1

# Core boards only. This file must contain exactly Lifecycle and Daily.
# One lifecycle board per exact project is generated at runtime (id
# `project:<name>`) for every project that has tasks in scope, so project
# boards are never configured here. All project boards share the reserved
# rank UDA `sisyphus_rank_project`.
#
# `ready_tag` (default: next) is the board-managed marker for the Ready
# column. Sisyphus never exposes tags to the user; it only toggles this one.

boards:
  - id: lifecycle
    name: Lifecycle
    description: All active work by Taskwarrior lifecycle
    template: lifecycle
    scope:
      filter: status:pending or status:waiting or status:completed
      completed_days: 14
    ordering:
      mode: manual
      rank_uda: sisyphus_rank_lifecycle
      fallback:
        - urgency: desc
        - entry: asc
    mobile:
      default_column: doing
    columns:
      - id: backlog
        name: Backlog
        match: { preset: backlog }
        write: { preset: backlog }
      - id: ready
        name: Ready
        match: { preset: ready }
        write: { preset: ready }
      - id: doing
        name: Doing
        match: { preset: doing }
        write: { preset: doing }
        wip_limit: 3
      - id: waiting
        name: Waiting
        match: { preset: waiting }
        write: { preset: waiting }
      - id: done
        name: Done
        match: { preset: done }
        write: { preset: done }

  - id: daily
    name: Daily
    description: Time-focused view of pending work
    template: daily
    scope:
      filter: status:pending or status:waiting
    ordering:
      mode: computed
      by:
        - due: asc
        - urgency: desc
    columns:
      - id: overdue
        name: Overdue
        match: { filter: "due.before:today" }
        write: null
      - id: today
        name: Today
        match: { filter: "due:today" }
        write:
          set: { due: today }
      - id: upcoming
        name: Upcoming
        match: { filter: "due.after:today" }
        write:
          prompt: { field: due, input: date }
      - id: no-date
        name: No date
        match: { filter: "due.none:" }
        write:
          clear: [due]
